name: Validate Skills

on:
  push:
    paths:
      - 'commands/**'
      - 'skills/**'
      - '.github/workflows/validate-skills.yml'
  pull_request:
    paths:
      - 'commands/**'
      - 'skills/**'
      - '.github/workflows/validate-skills.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Run skillscheck
        run: uvx skillscheck ./skills

      - name: Run skills-ref validate
        run: |
          failed=0
          for skill in ./skills/*/; do
            uvx --from "git+https://github.com/agentskills/agentskills#subdirectory=skills-ref" skills-ref validate "$skill" || failed=1
          done
          exit $failed
