name: Continuous Integration

on:
  push:
    paths:
      - 'apm.yml'
      - 'apm.lock.yaml'
      - '.apm/**'
      - '.claude-plugin/**'
      - 'commands/**'
      - '.github/workflows/**'
      - 'skills/**'
      
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: christiangalsterer/github-actions/.github/workflows/claude_code_plugins_ci.yaml@main